# Compatibility demo (spec §61) step 2: adds one nullable, customer-visible
# field. Expected result when registered: compatibility = NON_BREAKING,
# accepted as a minor version bump over 1.0.0.

apiVersion: data-platform/v1

kind: DataProduct

metadata:
  id: event-performance
  name: Event Performance
  version: "1.1.0"

spec:

  domain:
    id: events

  owner:
    id: event-analytics
    displayName: Event Analytics

  description: Business-ready event performance data.

  productType: DATASET

  lifecycle:
    status: ACTIVE

  grain:
    description: One row per event
    keys:
      - event_id

  schema:

    - name: event_id
      type: string
      required: true
      grainKey: true
      classification: INTERNAL

    - name: venue_id
      type: string
      required: true
      classification: INTERNAL

    - name: event_date
      type: date
      required: true

    - name: tickets_sold
      type: long
      required: false

    - name: gross_revenue
      type: "decimal(18,2)"
      required: false

    - name: revenue_per_ticket
      type: "decimal(18,2)"
      required: false

    - name: discount_amount
      type: "decimal(18,2)"
      required: false
      description: Total discount value applied across ticket sales for the event.

  delivery:

    methods:

      - type: FILE
        enabled: true
        formats:
          - PARQUET
          - CSV

      - type: API
        enabled: true
        api:
          resource: events
          filters:
            - event_id
            - venue_id
            - event_date_from
            - event_date_to
            - updated_since
          sorts:
            - event_date
            - event_id
          defaultSort:
            - event_date
            - event_id
          defaultPageSize: 100
          maxPageSize: 500
          maxResponseBytes: 5000000

  sla:

    freshnessMinutes: 240
    availabilityTargetPercent: 99.9
    maximumPublicationLatencyMinutes: 30

  quality:

    minimumCompletenessPercent: 99
    grainUniqueRequired: true

  publication:

    defaultFormat: PARQUET
    expirationHours: 168

    filenamePattern: "event-performance-{date}-{publicationId}"
