[project]
name = "serving_projection"
version = "0.1.0"
description = "Phase 8 Gold -> API Serving Store projection layer for the customer data exchange platform"
requires-python = ">=3.10,<3.13"
readme = "README.md"
dependencies = [
    "pyiceberg[sql-postgres,pyarrow,s3fs]>=0.7.1,<0.13",
    "pyiceberg_core>=0.10.1",
    "pyarrow>=16.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "structlog>=24.1.0",
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
