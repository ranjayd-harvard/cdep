services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* vars must be build args, not runtime `environment:` —
      # Next.js inlines them into the JS bundle at `next build` time, so
      # changing them here and restarting (without rebuilding) has no
      # effect. Changing any of these three requires `docker compose up --build`.
      args:
        NEXT_PUBLIC_APP_NAME: "${NEXT_PUBLIC_APP_NAME:-Data Exchange}"
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-}"
        NEXT_PUBLIC_USE_MOCK_SERVICES: "${NEXT_PUBLIC_USE_MOCK_SERVICES:-true}"
    image: customer-data-exchange-portal:local
    ports:
      - "3091:3000"
    environment:
      AUTH_SECRET: "${AUTH_SECRET:?Set AUTH_SECRET in your .env file. Generate one with: npx auth secret}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3091}"
      MONGODB_URI: "mongodb://${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in your .env file}:${MONGO_ROOT_PASS:?Set MONGO_ROOT_PASS in your .env file}@mongo:27017/${MONGO_DATABASE:-portal}?authSource=admin"
      AUTH_GOOGLE_ID: "${AUTH_GOOGLE_ID:-}"
      AUTH_GOOGLE_SECRET: "${AUTH_GOOGLE_SECRET:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-no-reply@portal.local}"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27025:27017"
    environment:
      MONGO_INITDB_DATABASE: "${MONGO_DATABASE:-portal}"
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in your .env file}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASS:?Set MONGO_ROOT_PASS in your .env file}"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "${MONGO_ROOT_USER:-}",
          "-p",
          "${MONGO_ROOT_PASS:-}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo_data:
