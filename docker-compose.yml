services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* vars must be build args, not runtime `environment:` —
      # Next.js inlines them into the JS bundle at `next build` time, so
      # changing them here and restarting (without rebuilding) has no
      # effect. Changing any of these three requires `docker compose up --build`.
      args:
        NEXT_PUBLIC_APP_NAME: "${NEXT_PUBLIC_APP_NAME:-Data Exchange}"
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-}"
        NEXT_PUBLIC_USE_MOCK_SERVICES: "${NEXT_PUBLIC_USE_MOCK_SERVICES:-true}"
    image: customer-data-exchange-portal:local
    ports:
      - "3091:3000"
    environment:
      AUTH_SECRET: "${AUTH_SECRET:?Set AUTH_SECRET in your .env file. Generate one with: npx auth secret}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3091}"
      MONGODB_URI: "mongodb://${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in your .env file}:${MONGO_ROOT_PASS:?Set MONGO_ROOT_PASS in your .env file}@mongo:27017/${MONGO_DATABASE:-portal}?authSource=admin"
      AUTH_GOOGLE_ID: "${AUTH_GOOGLE_ID:-}"
      AUTH_GOOGLE_SECRET: "${AUTH_GOOGLE_SECRET:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-no-reply@portal.local}"
      # data-exchange-service integration — see
      # docs/exchange-service-integration.md. "host.docker.internal" is
      # Docker Desktop's DNS name for the host machine: this container
      # can't reach data-exchange-service's own docker-compose network
      # directly, but it CAN reach data-exchange-service's host-published
      # port 8080 this way. Leave EXCHANGE_SERVICE_URL unset to fall back
      # to the Mongo-backed services untouched.
      EXCHANGE_SERVICE_URL: "${EXCHANGE_SERVICE_URL:-}"
      EXCHANGE_SERVICE_INTERNAL_API_KEY: "${EXCHANGE_SERVICE_INTERNAL_API_KEY:-}"
      # Demo/testing convenience switch — see .env.example. Defaults to true
      # (fixture-content simulator) when unset.
      DEMO_FIXTURE_PUBLISH_ENABLED: "${DEMO_FIXTURE_PUBLISH_ENABLED:-true}"
      # data-lakehouse superadmin integration — backs /admin/lakehouse. Same
      # opt-in pattern as EXCHANGE_SERVICE_URL above: unset means that page
      # renders a "not configured" empty state instead of crashing.
      # "host.docker.internal" reaches data-lakehouse's own host-published
      # API port (8090) the same way EXCHANGE_SERVICE_URL reaches 8080.
      LAKEHOUSE_SERVICE_URL: "${LAKEHOUSE_SERVICE_URL:-}"
      LAKEHOUSE_SERVICE_INTERNAL_API_KEY: "${LAKEHOUSE_SERVICE_INTERNAL_API_KEY:-}"
      # data-publication-service superadmin integration — backs the
      # "Publish Gold Product" panel on /admin/lakehouse/pipelines. Same
      # opt-in pattern as LAKEHOUSE_SERVICE_URL above. "host.docker.internal"
      # reaches data-publication-service's own host-published API port
      # (8091) the same way LAKEHOUSE_SERVICE_URL reaches 8090.
      PUBLICATION_SERVICE_URL: "${PUBLICATION_SERVICE_URL:-}"
      PUBLICATION_SERVICE_INTERNAL_API_KEY: "${PUBLICATION_SERVICE_INTERNAL_API_KEY:-}"
      # data-product-catalog-service integration (Phase 5) — backs
      # src/lib/catalog-service/client.ts. Same opt-in pattern as
      # PUBLICATION_SERVICE_URL above. "host.docker.internal" reaches
      # data-product-catalog-service's own host-published API port (8092)
      # the same way PUBLICATION_SERVICE_URL reaches 8091.
      CATALOG_SERVICE_URL: "${CATALOG_SERVICE_URL:-}"
      CATALOG_SERVICE_INTERNAL_API_KEY: "${CATALOG_SERVICE_INTERNAL_API_KEY:-}"
      # subscription-service integration (Phase 6) — backs
      # src/lib/subscription-service/client.ts. Customer-facing (/v1/*)
      # endpoints only, so no internal API key is needed here. Same opt-in
      # pattern as CATALOG_SERVICE_URL above. "host.docker.internal" reaches
      # subscription-service's own host-published API port (8093).
      SUBSCRIPTION_SERVICE_URL: "${SUBSCRIPTION_SERVICE_URL:-}"
      # scheduling-service integration (Phase 7) — backs
      # src/lib/scheduling-service/client.ts. Same opt-in, customer-facing-
      # only pattern as SUBSCRIPTION_SERVICE_URL above. "host.docker.internal"
      # reaches scheduling-service's own host-published API port (8094).
      SCHEDULING_SERVICE_URL: "${SCHEDULING_SERVICE_URL:-}"
      # Needed because this container also runs in Docker: the signed
      # upload URL's hostname (data-exchange-service's own
      # OBJECT_STORAGE_PUBLIC_ENDPOINT, typically "localhost:9000") means
      # something different from inside this container than it does on
      # the host or in a real browser. See the doc comment on
      # `putToSignedUrl` in src/lib/exchange-service/client.ts.
      EXCHANGE_SERVICE_STORAGE_RELAY_HOST: "${EXCHANGE_SERVICE_STORAGE_RELAY_HOST:-}"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27025:27017"
    environment:
      MONGO_INITDB_DATABASE: "${MONGO_DATABASE:-portal}"
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in your .env file}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASS:?Set MONGO_ROOT_PASS in your .env file}"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "${MONGO_ROOT_USER:-}",
          "-p",
          "${MONGO_ROOT_PASS:-}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo_data:
