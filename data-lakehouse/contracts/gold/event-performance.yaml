# Gold Data Product contract for "event-performance" (AGENTS.md section 23).

dataProduct:
  id: event-performance
  name: Event Performance
  version: "1.0"
  owner: Event Analytics
  description: >
    Business-ready event performance data for entitled consumers, derived
    from silver.event.

source:
  table: silver.event

grain: "One row per organization_id, tenant_id and event_id."

keys:
  - organization_id
  - tenant_id
  - event_id

schema:
  event_id:
    type: string
    required: true
  venue_id:
    type: string
    required: true
  event_date:
    type: date
    required: true
  tickets_sold:
    type: long
    required: false
  gross_revenue:
    type: decimal(18,2)
    required: false
  revenue_per_ticket:
    type: decimal(18,2)
    required: false

sla:
  freshnessMinutes: 240

quality:
  minimumCompletenessPercent: 99
  rules:
    - name: event_id_complete
      type: not_null
      column: event_id
      severity: ERROR

    - name: venue_id_complete
      type: not_null
      column: venue_id
      severity: ERROR

    - name: event_date_complete
      type: not_null
      column: event_date
      severity: ERROR

    - name: tickets_non_negative
      type: min
      column: tickets_sold
      value: 0
      severity: ERROR

    - name: revenue_non_negative
      type: min
      column: gross_revenue
      value: 0
      severity: ERROR

  policy:
    errorThresholdPercent: 1.0
    onFailure:
      quarantineInvalidRecords: true
      failPipeline: false

publication:
  formats:
    - PARQUET
    - CSV
