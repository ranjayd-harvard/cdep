# Silver contract for the canonical "test_metric" entity.
# Synthetic test entity used to validate onboarding a brand-new data
# product end-to-end -- see
# data-exchange-service/TEST-DataProduct-onboarding.MD.

entity: test_metric
version: "1.0"
owner: data-platform
description: >
  Canonical enterprise representation of a test metric: validated,
  standardized, deduplicated, business-key aware. Sourced from
  bronze.test_metrics via
  mappings/bronze_to_silver/test-metrics-to-test-metric.yaml.

businessKey:
  - organization_id
  - tenant_id
  - metric_id

deduplication:
  order_by: _source_received_at
  tiebreaker: _ingested_at

incremental:
  strategy: UPSERT

quality:
  rules:
    - name: metric_id_required
      type: not_null
      column: metric_id
      severity: ERROR

    - name: metric_label_required
      type: not_null
      column: metric_label
      severity: ERROR

    - name: recorded_on_valid
      type: not_null
      column: recorded_on
      severity: ERROR

    - name: metric_value_non_negative
      type: min
      column: metric_value
      value: 0
      severity: ERROR

  policy:
    errorThresholdPercent: 1.0
    onFailure:
      quarantineInvalidRecords: true
      failPipeline: false
