# S3-compatible storage backend pointed at a local MinIO instance.
# This is the default for `docker compose up` local development.
kind: s3
endpoint_url: http://localhost:9010
region: us-east-1
access_key_env: LAKEHOUSE_S3_ACCESS_KEY
secret_key_env: LAKEHOUSE_S3_SECRET_KEY
path_style_access: true
buckets:
  exchange_inbound: exchange-inbound
  bronze: lakehouse-bronze
  silver: lakehouse-silver
  gold: lakehouse-gold
