# NOT USED IN THIS PHASE.
#
# Phase 2 uses PyIceberg + PyArrow as the local engine instead of PySpark
# (see README "Engine choice: PyIceberg vs. Spark" for why). This file is
# kept as a placeholder so that reintroducing Spark later — for example to
# scale out Silver/Gold transformations — does not require restructuring
# the config/ directory. A future Spark engine would need settings such as:
#
# spark.sql.extensions                                  org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
# spark.sql.catalog.local                                org.apache.iceberg.spark.SparkCatalog
# spark.sql.catalog.local.catalog-impl                   org.apache.iceberg.jdbc.JdbcCatalog
# spark.sql.catalog.local.uri                             ${LAKEHOUSE_CATALOG_URI}
# spark.sql.catalog.local.warehouse                       ${LAKEHOUSE_WAREHOUSE}
# spark.sql.catalog.local.io-impl                         org.apache.iceberg.aws.s3.S3FileIO
# spark.hadoop.fs.s3a.endpoint                            ${LAKEHOUSE_S3_ENDPOINT}
# spark.hadoop.fs.s3a.path.style.access                   true
