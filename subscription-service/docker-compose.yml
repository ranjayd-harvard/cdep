name: subscription-service

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: subscription
      POSTGRES_PASSWORD: subscription
      POSTGRES_DB: subscription
    ports:
      # Host port 5438: 5432 (host default), 5433 (data-exchange-service),
      # 5434 (data-lakehouse), 5435 (an unrelated local project), 5436
      # (data-publication-service), and 5437 (data-product-catalog-service)
      # are already taken on this machine. Internal port stays 5432.
      - "5438:5432"
    volumes:
      - subscription-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subscription -d subscription"]
      interval: 5s
      timeout: 5s
      retries: 10

  subscription-service:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Host port 8093: 8080 (data-exchange-service), 8090 (data-lakehouse),
      # 8091 (data-publication-service), and 8092 (data-product-catalog-service)
      # are already taken.
      - "8093:8093"
    environment:
      NODE_ENV: development
      PORT: 8093
      DATABASE_URL: postgresql://subscription:subscription@postgres:5432/subscription
      AUTH_MODE: development
      INTERNAL_API_TOKEN: dev-internal-key-change-me
      # data-product-catalog-service runs in its own isolated compose
      # network on the host, reached the same way the portal reaches it —
      # see data-product-catalog-service/docker-compose.yml's own comment.
      CATALOG_SERVICE_URL: http://host.docker.internal:8092
      CATALOG_SERVICE_INTERNAL_API_KEY: dev-internal-key-change-me
      CATALOG_SERVICE_TIMEOUT_SECONDS: 5
      IDEMPOTENCY_TTL_HOURS: 24
      LOG_LEVEL: info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "dist/scripts/start.js"]

volumes:
  subscription-postgres-data:
